name: Migrate database

# Applies new files in supabase/migrations/ to the live Supabase database whenever they land on main.
# Needs the SUPABASE_DB_URL repository secret (see README "Database migrations").

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

concurrency:
  group: migrate-database
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Check secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Add the SUPABASE_DB_URL repository secret (see README 'Database migrations')."
            exit 1
          fi
      - name: Apply new migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
